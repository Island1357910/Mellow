# Install as a separate virtual host after obtaining the certificate.
server {
    listen 80;
    server_name workshop-api.mymellow.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mellow-workshop-acme;
    }

    location / {
        return 308 https://workshop-api.mymellow.top$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name workshop-api.mymellow.top;
    ssl_certificate /etc/letsencrypt/live/workshop-api.mymellow.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workshop-api.mymellow.top/privkey.pem;

    client_max_body_size 3m;
    client_body_buffer_size 256k;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
        proxy_connect_timeout 3s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
