name: Publish Mellow website
on:
  push:
    branches: [gh-pages]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mellow-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Include verified Android 2.0.0 download
        run: |
          curl -fsSL --retry 3 https://github.com/Island1357910/Mellow/releases/download/android-v2.0.0/Mellow-2.0.0.apk -o downloads/Mellow-2.0.0.apk
          (cd downloads && sha256sum -c Mellow-2.0.0.sha256.txt)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
